patch:

  # 字体大小
  style/font_point: 18
  style/label_font_point: 16
  style/comment_font_point: 15

  # 字体：让中文更饱满
  style/font_face: "PingFang SC"
  style/label_font_face: "PingFang SC"
  style/comment_font_face: "PingFang SC"

  # 候选框横向排列
  style/candidate_list_layout: linear
  style/text_orientation: horizontal
  style/inline_preedit: true

  # 候选格式：移除编号和词之间的空格
  style/candidate_format: "%c. %@"

  # 横向候选之间的间距
  style/candidate_spacing: 0

  # 候选间间距
  style/spacing: 0
  style/line_spacing: 0

  # 减少高亮背景相对文字的额外扩张
  style/surrounding_extra_expansion: -4

  # 调整文字垂直位置
  style/base_offset: 1

  # 圆角
  style/corner_radius: 6
  style/hilited_corner_radius: 0

  # 边框 和 阴影
  style/border_height: 0
  style/border_width: 0
  style/shadow_size: 2

  # 浅色/深色主题
  style/color_scheme: mac_light
  style/color_scheme_dark: mac_dark

  # Safari / Maps 不默认进入英文模式
  app_options/com.apple.Safari/ascii_mode: false
  app_options/com.apple.Maps/ascii_mode: false

  preset_color_schemes/mac_light:
    name: "Mac Light"
    back_color: 0xFFFFFF
    border_color: 0xDDDDDD
    text_color: 0x333333
    candidate_text_color: 0x333333
    comment_text_color: 0x888888
    label_color: 0x888888

    # 被选中的候选词，macOS 蓝色
    hilited_candidate_back_color: 0xFF7A00
    hilited_candidate_text_color: 0xFFFFFF
    hilited_comment_text_color: 0xFFFFFF
    hilited_candidate_label_color: 0xFFFFFF

  preset_color_schemes/mac_dark:
    name: "Mac Dark"
    back_color: 0x2B2B2B
    border_color: 0x444444
    text_color: 0xEEEEEE
    candidate_text_color: 0xEEEEEE
    comment_text_color: 0xAAAAAA
    label_color: 0xAAAAAA

    # 被选中的候选词，macOS 蓝色
    hilited_candidate_back_color: 0xFF7A00
    hilited_candidate_text_color: 0xFFFFFF
    hilited_comment_text_color: 0xFFFFFF
    hilited_candidate_label_color: 0xFFFFFF
