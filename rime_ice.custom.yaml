patch:
  translator/enable_completion: true
  translator/enable_sentence: true
  translator/enable_user_dict: true
  translator/contextual_suggestions: true
  pin_cand_filter/@1: "m\t嘛 吗"
  speller/algebra/+:
    # - derive/^正确拼音$/错误输入/

# === 韵母内部键序错位容错：final transposition typo tolerance ===

    # an <- na
    - derive/^([bpmfdtnlgkhjqxzcsryw]|zh|sh|ch)an$/$1na/

    # ang <- agn / nag
    - derive/^([bpmfdtnlgkhjqxzcsryw]|zh|sh|ch)ang$/$1agn/
    - derive/^([bpmfdtnlgkhjqxzcsryw]|zh|sh|ch)ang$/$1nag/
    
    # ao <- oa，例如 lao <- loa, zao <- zoa
    - derive/^([bpmfdtnlgkhzcs]|zh|sh|ch)ao$/$1oa/

    # en <- ne
    - derive/^([bpmfdtnlgkhjqxzcsrw]|zh|sh|ch)en$/$1ne/

    # eng <- egn / neg
    - derive/^([bpmfdtnlgkhjqxzcsryw]|zh|sh|ch)eng$/$1egn/
    - derive/^([bpmfdtnlgkhjqxzcsryw]|zh|sh|ch)eng$/$1neg/

    # ian <- ain / ina
    - derive/^([bpmdtnljqx])ian$/$1ain/
    - derive/^([bpmdtnljqx])ian$/$1ina/

    # iang <- aing / iagn / inag
    - derive/^([jqxnl])iang$/$1aing/
    - derive/^([jqxnl])iang$/$1iagn/
    - derive/^([jqxnl])iang$/$1inag/

    # iao <- aio / ioa，例如 jiao <- jaio / jioa
    - derive/^([bpmdtnljqx])iao$/$1aio/
    - derive/^([bpmdtnljqx])iao$/$1ioa/

    # ie <- ei，例如 jie <- jei, qie <- qei, xie <- xei
    - derive/^([jqx])ie$/$1ei/

    # in <- ni
    - derive/^([bpmfdtnlgkhjqxzcsryw]|zh|sh|ch)in$/$1ni/

    # ing <- ign / nig
    - derive/^([bpmfdtnlgkhjqxzcsryw]|zh|sh|ch)ing$/$1ign/
    - derive/^([bpmfdtnlgkhjqxzcsryw]|zh|sh|ch)ing$/$1nig/

    # iong <- iogn / inog
    - derive/^([jqx])iong$/$1iogn/
    - derive/^([jqx])iong$/$1inog/

    # me <- em，例如 zenme <- zenem, shenme <- shenem
    - derive/^me$/em/

    # wu <- uw
    - derive/^wu$/uw/

    # ju/qu/xu/yu <- uj/uq/ux/uy
    - derive/^(j|q|x|y)u$/u$1/

    # ong <- ogn / nog
    - derive/^([bpmfdtnlgkhjqxzcsr]|zh|sh|ch)ong$/$1ogn/
    - derive/^([bpmfdtnlgkhjqxzcsr]|zh|sh|ch)ong$/$1nog/
    
    # uai <- aui / uia，例如 guai <- gaui / guia
    - derive/^([gkh]|zh|sh|ch)uai$/$1aui/
    - derive/^([gkh]|zh|sh|ch)uai$/$1uia/

    # uan <- una / aun
    - derive/^([dtnlgkhrzcsjqxy]|zh|sh|ch)uan$/$1una/
    - derive/^([dtnlgkhrzcsjqxy]|zh|sh|ch)uan$/$1aun/

    # uang <- aung / uagn / unag，例如 guang <- gaung / guagn / gunag
    - derive/^([gkh]|zh|sh|ch)uang$/$1aung/
    - derive/^([gkh]|zh|sh|ch)uang$/$1uagn/
    - derive/^([gkh]|zh|sh|ch)uang$/$1unag/

    # ue <- eu，例如 jue <- jeu, que <- qeu, xue <- xeu, yue <- yeu
    - derive/^([jqxy])ue$/$1eu/

# === 复合声母边界错位：compound-initial boundary transposition ===

    # zhang <- zahng, shang <- sahng, chang <- cahng
    - derive/^(z|s|c)hang$/$1ahng/

    # chu <- c hu, zhua <- z hua, shuo <- s huo
    - derive/^([zcs])h(a|ai|an|ang|ao|e|en|eng|ong|ou|u|ua|uai|uan|uang|ui|un|uo)$/$1 h$2/

    # zhuan <- zuhan；zh/sh/ch 后的 h 被打到 u 后面
    - derive/^([zcs])hua$/$1uha/
    - derive/^([zcs])huai$/$1uhai/
    - derive/^([zcs])huan$/$1uhan/
    - derive/^([zcs])huang$/$1uhang/
    - derive/^([zcs])hui$/$1uhi/
    - derive/^([zcs])hun$/$1uhn/
    - derive/^([zcs])huo$/$1uho/

# === ia / ai 韵母互换容错：vowel-swap typo tolerance ===

    # xia <- xai, jia <- jai, qia <- qai
    - derive/^([jqx])ia$/$1ai/

    # zai <- zia, cai <- cia, dai <- dia, lai <- lia
    - derive/^([zcdl])ai$/$1ia/

# === 声母与韵母首字母错位：initial–final boundary transposition ===

    # an <- a + 声母 + n，例如 lan <- aln, ban <- abn
    - derive/^([bpmfdtnlgkhrzcs])an$/a$1n/

    # ang <- a + 声母 + ng，例如 lang <- alng, kang <- akng
    - derive/^([bpmfdtnlgkhrzcs])ang$/a$1ng/

    # ai <- a + 声母 + i，例如 hai <- ahi, zhai <- azhi
    - derive/^([bpmdtnlgkhzcs]|zh|sh|ch)ai$/a$1i/

    # ao <- a + 声母 + o；只保留低风险的 hao <- aho
    - derive/^hao$/aho/

    # en <- e + 声母 + n，例如 ben <- ebn, ren <- ern
    - derive/^([bpmfdtnlgkhrzcs])en$/e$1n/

    # eng <- e + 声母 + ng，例如 neng <- enng, leng <- elng
    - derive/^([bpmfdtnlgkhrzcs])eng$/e$1ng/

    # ei <- e + 声母 + i，例如 bei <- ebi, zhei <- ezhi
    - derive/^([bpmfdtnlgkhzcs]|zh|sh)ei$/e$1i/

    # ian <- i + 声母 + an，例如 dian <- idan, lian <- ilan
    - derive/^([bpmdtnljqx])ian$/i$1an/

    # in <- i + 声母 + n，例如 lin <- iln, xin <- ixn
    - derive/^([bpmdtnljqx])in$/i$1n/

    # ing <- i + 声母 + ng，例如 ling <- ilng, xing <- ixng
    - derive/^([bpmdtnljqx])ing$/i$1ng/

    # ong <- o + 声母 + ng，例如 long <- olng, kong <- okng
    - derive/^([bpmfdtnlgkhrzcs])ong$/o$1ng/

    # ou <- o + 声母 + u，例如 hou <- ohu, shou <- oshu
    - derive/^([pmfdtnlgkhrzcs]|zh|sh|ch)ou$/o$1u/

    # ua <- u + 声母 + a，例如 hua <- uha, shua <- usha
    - derive/^([gkh]|zh|sh|ch)ua$/u$1a/

    # uai <- u + 声母 + ai，例如 huai <- uhai, shuai <- ushai
    - derive/^([gkh]|zh|sh|ch)uai$/u$1ai/

    # ui <- u + 声母 + i，例如 hui <- uhi, zhui <- uzhi
    - derive/^([gkhrzcs]|zh|sh|ch)ui$/u$1i/

    # un <- u + 声母 + n，例如 hun <- uhn, zhun <- uzhn
    - derive/^([dtnlgkhrzcs]|zh|sh|ch)un$/u$1n/

    # uo <- u + 声母 + o，例如 guo <- ugo, kuo <- uko, huo <- uho
    - derive/^([gkh])uo$/u$1o/
